name: CI

# Lint, types and tests. Runs on every pull request and push, and the deploy calls it before
# publishing: if something fails, nothing is published.
on:
  pull_request:
  push:
    # main is covered by the deploy, which calls this workflow.
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
